name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the default
# branch — including the automated "data: refresh figures" commits from the
# update-data workflow, so the live page reflects new stats automatically.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Redeploy after the scheduled data refresh. Its commit is made with the
  # GITHUB_TOKEN, which by design does NOT fire `push`, so we trigger off the
  # update workflow completing instead.
  workflow_run:
    workflows: ["Update data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the whole repo is the static site (index.html at the root)
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
